[workspace]
resolver = "2"
members = ["crates/agentplug-host", "crates/agentplug-lightpanda", "crates/agentplug-lightpanda-wasm", "crates/agentplug-runner", "crates/agentplug-trust"]
default-members = ["crates/agentplug-runner"]

[workspace.package]
edition = "2021"
version = "0.1.209"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
