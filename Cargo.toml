[workspace]
resolver = "2"
members = ["crates/agentplug-host", "crates/agentplug-lightpanda", "crates/agentplug-lightpanda-wasm", "crates/agentplug-runner"]
default-members = ["crates/agentplug-runner"]

[workspace.package]
edition = "2021"
version = "0.1.241"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
opt-level = "z"
