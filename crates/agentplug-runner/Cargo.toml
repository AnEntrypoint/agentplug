[package]
name = "agentplug-runner"
version.workspace = true
edition.workspace = true
license = "MIT"
build = "build.rs"

[[bin]]
name = "agentplug-runner"
path = "src/main.rs"

[dependencies]
agentplug-host = { path = "../agentplug-host" }
wasmtime = { version = "48.0.6", features = ["cache"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
ureq = { version = "2", features = ["tls"] }
sha2 = "0.10"
wait-timeout = "0.2"
fs2 = "0.4"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Console", "Win32_System_Threading"] }
