name: release

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: agentplug-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.bump.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Auto-bump patch version BEFORE build
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "lanmower"
          git config user.email "lanmower@users.noreply.github.com"
          git config url."https://${GH_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//;s/"//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
              sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$NEW_VERSION\"/}" Cargo.toml
                  cargo generate-lockfile
              cargo metadata --locked --offline --format-version=1 --no-deps >/dev/null
              git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: agentplug-runner-linux-x64
          - os: macos-14
            target: x86_64-apple-darwin
            asset: agentplug-runner-macos-x64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: agentplug-runner-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: agentplug-runner-windows-x64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: agentplug-runner-windows-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.bump.outputs.commit }}
          persist-credentials: false

      - name: Add target (the runner image already ships rustup and stable)
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          AGENTPLUG_RELEASE_BUILD: "1"
        run: cargo build -p agentplug-runner --bin agentplug-runner --release --target ${{ matrix.target }}

      - name: Stage asset with checksum
        shell: bash
        run: |
          set -e
          mkdir -p release-assets
          bin="target/${{ matrix.target }}/release/agentplug-runner"
          if [[ "${{ matrix.asset }}" == *.exe ]]; then bin="$bin.exe"; fi
          cp "$bin" "release-assets/${{ matrix.asset }}"
          cd release-assets
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" | sed 's/ \*/  /' > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" | sed 's/ \*/  /' > "${{ matrix.asset }}.sha256"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.asset }}
          path: release-assets/*
          retention-days: 1

  build-host-linux-arm64:
    needs: bump
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.bump.outputs.commit }}
          persist-credentials: false

      - name: Add target (the runner image already ships rustup and stable)
        run: rustup target add aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          key: host-linux-arm64

      - name: Build host runner
        env:
          AGENTPLUG_RELEASE_BUILD: "1"
        run: cargo build -p agentplug-runner --bin agentplug-runner --release --target aarch64-unknown-linux-gnu

      - name: Stage host release asset with checksum
        run: |
          set -e
          mkdir -p release-assets
          cp target/aarch64-unknown-linux-gnu/release/agentplug-runner release-assets/agentplug-runner-linux-arm64
          cd release-assets
          sha256sum agentplug-runner-linux-arm64 | sed 's/ \*/  /' > agentplug-runner-linux-arm64.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentplug-runner-linux-arm64
          path: release-assets/*
          retention-days: 1

  publish:
    needs: [bump, build, build-host-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          VER: ${{ needs.bump.outputs.version }}
          REPO: AnEntrypoint/agentplug-bin
          SHA: ${{ needs.bump.outputs.commit }}
        run: |
          set -euo pipefail
          ls -la release-assets
          gh release create "v$VER" \
            --repo "$REPO" \
            --title "agentplug-runner v$VER" \
            --notes "Auto-published from agentplug CI at $SHA" \
            --draft
          gh release upload "v$VER" --repo "$REPO" release-assets/*
          expected=$(for f in release-assets/*; do basename "$f"; done | sort)
          uploaded=$(gh release view "v$VER" --repo "$REPO" --json assets --jq '.assets[].name' | sort)
          if [ "$expected" != "$uploaded" ]; then
            echo "::error::draft release v$VER does not contain exactly the built asset set" >&2
            exit 1
          fi
          gh release edit "v$VER" --repo "$REPO" --draft=false

      - name: Verify every uploaded asset is actually fetchable
        env:
          VER: ${{ needs.bump.outputs.version }}
          REPO: AnEntrypoint/agentplug-bin
        run: |
          set -e
          base="https://github.com/$REPO/releases/download/v$VER"
          for f in release-assets/*; do
            name=$(basename "$f")
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$base/$name")
            if [ "$code" != "200" ]; then
              echo "::error::published release v$VER's $name is not fetchable (HTTP $code)" >&2
              exit 1
            fi
          done
          echo "[ok] all $(ls release-assets | wc -l) release assets confirmed fetchable at $base"

      - name: Ask gm to advance its submodule pins
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        shell: bash
        run: gh api repos/AnEntrypoint/gm/dispatches -f event_type=submodule-released || echo "::warning::gm dispatch failed; bump-pins will pick this up on its next schedule"
