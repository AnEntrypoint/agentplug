name: release

on:
  push:
    branches: [main]

concurrency:
  group: agentplug-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PUBLISHER_TOKEN }}
          fetch-depth: 0

      - name: Auto-bump patch version BEFORE build
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          set -e
          git config user.name "agentplug-bot"
          git config user.email "noreply@github.com"
          git config url."https://${GH_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//;s/"//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$NEW_VERSION\"/}" Cargo.toml
          git add Cargo.toml
          if git diff --cached --quiet; then
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: agentplug-runner-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: agentplug-runner-linux-arm64
          # macos-13 (Intel-hosted) GitHub runners are capacity-constrained
          # to the point of queuing indefinitely (confirmed live: 26+ minutes
          # queued, never started). Cross-compiling x86_64 from the arm64
          # macos-14 runner is the standard, reliable alternative -- Xcode's
          # linker and SDK on Apple Silicon already support both slices.
          - os: macos-14
            target: x86_64-apple-darwin
            asset: agentplug-runner-macos-x64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: agentplug-runner-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: agentplug-runner-windows-x64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: agentplug-runner-windows-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build -p agentplug-runner --bin agentplug-runner --release --target ${{ matrix.target }}

      - name: Stage asset with checksum
        shell: bash
        run: |
          set -e
          mkdir -p release-assets
          bin="target/${{ matrix.target }}/release/agentplug-runner"
          if [[ "${{ matrix.asset }}" == *.exe ]]; then bin="$bin.exe"; fi
          cp "$bin" "release-assets/${{ matrix.asset }}"
          cd release-assets
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" | sed 's/ \*/  /' > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" | sed 's/ \*/  /' > "${{ matrix.asset }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/*
          retention-days: 1

  publish:
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          VER: ${{ needs.bump.outputs.version }}
          REPO: AnEntrypoint/agentplug-bin
          SHA: ${{ github.sha }}
        run: |
          set -e
          ls -la release-assets
          if ! gh release view "v$VER" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "v$VER" \
              --repo "$REPO" \
              --title "agentplug-runner v$VER" \
              --notes "Auto-published from agentplug CI at $SHA"
          fi
          gh release upload "v$VER" --repo "$REPO" --clobber release-assets/*

      - name: Verify every uploaded asset is actually fetchable
        env:
          VER: ${{ needs.bump.outputs.version }}
          REPO: AnEntrypoint/agentplug-bin
        run: |
          set -e
          base="https://github.com/$REPO/releases/download/v$VER"
          for f in release-assets/*; do
            name=$(basename "$f")
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$base/$name")
            if [ "$code" != "200" ]; then
              echo "::error::published release v$VER's $name is not fetchable (HTTP $code)"
              exit 1
            fi
          done
          echo "[ok] all $(ls release-assets | wc -l) release assets confirmed fetchable at $base"
