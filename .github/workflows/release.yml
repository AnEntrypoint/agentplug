name: release

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: agentplug-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Checkout agentplug
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PUBLISHER_TOKEN }}
          fetch-depth: 0

      - name: Auto-bump agentplug workspace patch version BEFORE build
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          git config user.name "gm-bot"
          git config user.email "noreply@github.com"
          git config url."https://${GH_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//;s/"//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$NEW_VERSION\"/}" Cargo.toml
          git add Cargo.toml
          if git diff --cached --quiet; then
            echo "No version change needed"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase onto origin/main hit a real conflict; refusing to auto-resolve with -X theirs (would silently discard concurrent main changes)."
              git rebase --abort
              exit 1
            fi
            git push origin HEAD:main
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: bump
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: agentplug-runner-windows-x64.exe
            bin_name: agentplug-runner.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: agentplug-runner-windows-arm64.exe
            bin_name: agentplug-runner.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: agentplug-runner-macos-x64
            bin_name: agentplug-runner
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: agentplug-runner-macos-arm64
            bin_name: agentplug-runner
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: agentplug-runner-linux-x64
            bin_name: agentplug-runner
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: agentplug-runner-linux-arm64
            bin_name: agentplug-runner
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: agentplug-runner-${{ matrix.target }}
          workspaces: '. -> target'

      - name: Install cross (aarch64-linux cross-compile)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release -p agentplug-runner --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p agentplug-runner --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: bump
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Wait for as many build-matrix artifacts as show up within a bound, tolerating any single stuck-queued unscheduled leg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for i in $(seq 1 20); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.total_count')
            echo "poll $i: $count artifact(s) so far"
            if [ "$count" -ge 6 ]; then
              echo "all 6 platform artifacts present"
              break
            fi
            sleep 30
          done

      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          path: artifacts

      - name: Stage release assets with checksums
        run: |
          mkdir -p release-assets artifacts
          shopt -s nullglob
          files=(artifacts/*/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no build artifacts available yet -- skipping release"
            exit 0
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            cp "$f" "release-assets/$name"
            sha256sum "release-assets/$name" | sed 's/ \*/  /' > "release-assets/$name.sha256"
          done
          ls -la release-assets
          echo "have_assets=true" >> "$GITHUB_ENV"

      - name: Publish to agentplug-bin Release
        if: env.have_assets == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          VER: ${{ needs.bump.outputs.version }}
          BUILT_SHA: ${{ needs.bump.outputs.sha }}
        run: |
          set -e
          if ! gh release view "v$VER" --repo AnEntrypoint/agentplug-bin >/dev/null 2>&1; then
            gh release create "v$VER" \
              --repo AnEntrypoint/agentplug-bin \
              --title "agentplug-runner v$VER" \
              --notes "Native cross-platform wasm plugin-host runner, auto-published from agentplug CI at $BUILT_SHA"
          fi
          gh release upload "v$VER" --repo AnEntrypoint/agentplug-bin --clobber release-assets/*
